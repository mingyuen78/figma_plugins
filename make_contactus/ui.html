<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #2c2c2c; color: white; text-align: center; }
    .options { display: flex; gap: 10px; margin-bottom: 20px; }
    .option { 
      flex: 1; 
      padding: 15px; 
      border: 2px solid #444; 
      border-radius: 8px; 
      cursor: pointer;
      transition: all 0.2s;
    }
    .option:hover { border-color: #18A0FB; }
    .option.selected { border-color: #18A0FB; background: rgba(24, 160, 251, 0.1); }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #18A0FB; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
    }
  </style>
</head>
<body>
  <h3>Contact Us Layout</h3>
  
  <button id="create">Create Layout</button>

  <script>
    document.getElementById('create').onclick = () => {
      parent.postMessage({ pluginMessage: { type: 'create-contact-us' } }, '*');
    };
  </script>
</body>
</html>
