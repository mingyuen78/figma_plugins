<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #2c2c2c; color: white; }
    .row { display: flex; align-items: center; margin-bottom: 15px; width: 100%; }
    label { flex: 1; font-size: 12px; color: #ccc; }
    select, input { 
      width: 150px; 
      padding: 6px; 
      font-size: 12px; 
      background: #444; 
      color: white; 
      border: 1px solid #666; 
      border-radius: 4px; 
    }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #18A0FB; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 10px; 
    }
    button:hover { background: #0d8de3; }
    .hint { font-size: 10px; color: #888; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h3 style="margin-top: 0;">Replace Font</h3>
  
  <div class="row">
    <label>Target Font</label>
    <select id="fontSelect">
      <option value="Ny Carlsberg Display">Ny Carlsberg Display</option>
      <option value="FZDaHei-B02S">FZDaHei-B02S</option>
      <option value="custom">Custom...</option>
    </select>
  </div>

  <div class="row" id="customRow" style="display: none;">
    <label>Font Name</label>
    <input type="text" id="customFont" placeholder="Enter font family...">
  </div>

  <button id="replace">Replace Fonts</button>
  <div class="hint">Will replace all text fonts in selection (or entire page if nothing selected)</div>

  <script>
    const fontSelect = document.getElementById('fontSelect');
    const customRow = document.getElementById('customRow');

    fontSelect.onchange = () => {
      customRow.style.display = fontSelect.value === 'custom' ? 'flex' : 'none';
    };

    document.getElementById('replace').onclick = () => {
      let fontFamily = fontSelect.value;
      if (fontFamily === 'custom') {
        fontFamily = document.getElementById('customFont').value;
      }

      if (!fontFamily) {
        alert('Please select or enter a font family');
        return;
      }

      parent.postMessage({ 
        pluginMessage: { 
          type: 'replace-font', 
          fontFamily 
        } 
      }, '*');
    };
  </script>
</body>
</html>
