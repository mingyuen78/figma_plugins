<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: sans-serif; padding: 20px; background: #2c2c2c; color: white; }
    .row { display: flex; align-items: center; margin-bottom: 15px; width: 100%; }
    label { flex: 1; font-size: 12px; color: #ccc; }
    select, input { 
      width: 150px; 
      padding: 6px; 
      font-size: 12px; 
      background: #444; 
      color: white; 
      border: 1px solid #666; 
      border-radius: 4px; 
    }
    button { 
      width: 100%; 
      padding: 12px; 
      background: #18A0FB; 
      color: white; 
      border: none; 
      border-radius: 4px; 
      cursor: pointer; 
      font-weight: bold; 
      margin-top: 10px; 
    }
    button:hover { background: #0d8de3; }
    .hint { font-size: 10px; color: #888; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>
  <h3 style="margin-top: 0;">Replace Font</h3>
  
  <div class="row">
    <label>Target Font</label>
    <select id="fontSelect">
      <option value="Ny Carlsberg Display">Ny Carlsberg Display</option>
      <option value="FZDaHei-B02S">FZDaHei-B02S</option>
      <option value="Bourton">Bourton</option>
      <option value="custom">Custom...</option>
    </select>
  </div>

  <div class="row" id="customRow" style="display: none;">
    <label>Font Name</label>
    <input type="text" id="customFont" placeholder="Enter font family...">
  </div>

  <div class="row">
    <label>Font Style</label>
    <select id="weightSelect">
      <option value="keep">Keep Original</option>
      <option value="Regular">Regular</option>
      <option value="Bold">Bold</option>
      <option value="Medium">Medium</option>
      <option value="Light">Light</option>
      <option value="Italic">Italic</option>
      <option value="custom-weight">Custom...</option>
    </select>
  </div>

  <div class="row" id="customWeightRow" style="display: none;">
    <label>Style Name</label>
    <input type="text" id="customWeight" placeholder="e.g. SemiBold, Base...">
  </div>

  <button id="replace">Replace Fonts</button>
  <div class="hint">Will replace all text fonts in selection (or entire page if nothing selected)</div>

  <script>
    const fontSelect = document.getElementById('fontSelect');
    const customRow = document.getElementById('customRow');
    const weightSelect = document.getElementById('weightSelect');
    const customWeightRow = document.getElementById('customWeightRow');

    const fontStyles = {
      'Bourton': ['Base 1664', 'Base Drop 1664', 'Regular', 'Bold'],
      'Ny Carlsberg Display': ['Regular', 'Bold', 'Black'],
      'FZDaHei-B02S': ['Regular'],
      'default': ['Regular', 'Bold', 'Medium', 'Light', 'Italic']
    };

    fontSelect.onchange = () => {
      const isCustom = fontSelect.value === 'custom';
      customRow.style.display = isCustom ? 'flex' : 'none';
      
      // Update styles dropdown
      const family = fontSelect.value;
      const styles = fontStyles[family] || fontStyles['default'];
      
      // Keep "Keep Original" and add family-specific styles
      weightSelect.innerHTML = '<option value="keep">Keep Original</option>';
      styles.forEach(style => {
        const opt = document.createElement('option');
        opt.value = style;
        opt.textContent = style;
        weightSelect.appendChild(opt);
      });
      weightSelect.innerHTML += '<option value="custom-weight">Custom...</option>';
      
      customWeightRow.style.display = 'none';
    };

    weightSelect.onchange = () => {
      customWeightRow.style.display = weightSelect.value === 'custom-weight' ? 'flex' : 'none';
    };

    document.getElementById('replace').onclick = () => {
      let fontFamily = fontSelect.value;
      if (fontFamily === 'custom') {
        fontFamily = document.getElementById('customFont').value;
      }

      let fontStyle = weightSelect.value;
      if (fontStyle === 'custom-weight') {
        fontStyle = document.getElementById('customWeight').value;
      }

      if (!fontFamily) {
        alert('Please select or enter a font family');
        return;
      }

      parent.postMessage({ 
        pluginMessage: { 
          type: 'replace-font', 
          fontFamily,
          fontStyle 
        } 
      }, '*');
    };
  </script>
</body>
</html>
